name: Schedule check

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report trigger and time
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          echo "Trigger: $TRIGGER"
          date -u
