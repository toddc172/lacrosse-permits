name: Property transfers D1

on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'
      timezone: America/Chicago

permissions: {}

concurrency:
  group: transfers-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: property-transfers

jobs:
  d1:
    if: >-
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.TRANSFERS_D1_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test source parsing and upload contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Test staged imports, reconciliation and SQL searches
        run: python -m unittest discover -s d1/tests -p test_d1.py -q
      - name: Test uploader retention and failed-import notice
        run: node tests/test_worker.mjs
      - name: Test public read-only API and reader
        run: node d1/tests/test_worker.mjs
      - name: Import approved source files into D1
        env:
          TRANSFERS_PUBLIC_REPOSITORY: 'true'
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.TRANSFERS_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRANSFERS_D1_DATABASE_ID: ${{ vars.TRANSFERS_D1_DATABASE_ID }}
          TRANSFERS_D1_API_TOKEN: ${{ secrets.TRANSFERS_D1_API_TOKEN }}
        run: python d1/sync_d1.py --mode production --max-months 3
