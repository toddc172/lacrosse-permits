name: Daily property transfer import

on:
  schedule:
    - cron: '37 7 * * *'
      timezone: America/Chicago
  workflow_dispatch:

permissions: {}

concurrency:
  group: transfers-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: property-transfers

jobs:
  publish:
    # Evaluated BEFORE a runner starts. Standard public-repository compute is free.
    if: >-
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test import and publication safeguards
        run: python -m unittest discover -s tests -p test_transfers.py -q
      - name: Test the upload Worker
        run: node tests/test_worker.mjs
      - name: Import, validate and publish
        env:
          TRANSFERS_PUBLIC_REPOSITORY: 'true'
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.TRANSFERS_KV_NAMESPACE_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.TRANSFERS_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python publish_transfers.py
      - name: Save the verified public dataset and daily check time
        # Only the allowlisted, already-public JSON is committed. No source uploads.
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/transfers.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public property transfer data'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
